name: unitycatalog-ui-new

services:
  unitycatalog:
    image: unitycatalog-ui-new-local-uc
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        MAVEN_PROXY_URL: "${MAVEN_PROXY_URL:-}"
    depends_on:
      postgres:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    ports:
      - "${UC_PORT:-8080}:8080"
    volumes:
      - uc_conf:/home/unitycatalog/etc/conf
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 24
    init: true

  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: "${RUSTFS_ACCESS_KEY:-rustfsadmin}"
      RUSTFS_SECRET_KEY: "${RUSTFS_SECRET_KEY:-rustfsadmin}"
    ports:
      - "${RUSTFS_API_PORT:-9000}:9000"
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs_data:/data

  rustfs-init:
    image: amazon/aws-cli:latest
    depends_on:
      rustfs:
        condition: service_started
    entrypoint: ["/bin/sh", "/bootstrap/bootstrap.sh"]
    environment:
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_ACCESS_KEY: "${RUSTFS_ACCESS_KEY:-rustfsadmin}"
      RUSTFS_SECRET_KEY: "${RUSTFS_SECRET_KEY:-rustfsadmin}"
      UC_STORAGE_BUCKET: "${UC_STORAGE_BUCKET:-uc-warehouse}"
      S3_REGION: "${S3_REGION:-us-east-1}"
      STS_DURATION_SECONDS: "${STS_DURATION_SECONDS:-43200}"
      UC_AUTH: "${UC_AUTH:-disable}"
      POSTGRES_HOST: postgres
      POSTGRES_DB: ucdb
      POSTGRES_USER: uc_default_user
      POSTGRES_PASSWORD: uc_default_password
    volumes:
      - ./docker/rustfs/bootstrap.sh:/bootstrap/bootstrap.sh:ro
      - ../etc/conf:/templates:ro
      - uc_conf:/conf

  postgres:
    image: postgres:16.3
    restart: unless-stopped
    environment:
      POSTGRES_DB: ucdb
      POSTGRES_USER: uc_default_user
      POSTGRES_PASSWORD: uc_default_password
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - uc_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  bridge:
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        CARGO_REGISTRY_URL: "${CARGO_REGISTRY_URL:-}"
      secrets:
        - cargo_config
    environment:
      UC_SERVER: http://unitycatalog:8080
      UI_AUTH_ENABLED: "${UI_AUTH_ENABLED:-false}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      OKTA_AUTH_ENABLED: "${OKTA_AUTH_ENABLED:-false}"
      KEYCLOAK_AUTH_ENABLED: "${KEYCLOAK_AUTH_ENABLED:-false}"
      RUST_LOG: "${RUST_LOG:-info}"
    depends_on:
      unitycatalog:
        condition: service_healthy
    expose:
      - "8081"
    init: true

  web:
    build:
      context: web
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY_URL: "${NPM_REGISTRY_URL:-}"
      secrets:
        - npm_config
    depends_on:
      bridge:
        condition: service_healthy
    ports:
      - "${UI_PORT:-3000}:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 12
    init: true

volumes:
  rustfs_data:
  uc_conf:
  uc_postgres_data:

secrets:
  cargo_config:
    file: "${CARGO_CONFIG_FILE:-${HOME}/.cargo/config.toml}"
  npm_config:
    file: "${NPM_CONFIG_FILE:-${HOME}/.npmrc}"
